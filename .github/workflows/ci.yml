name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Only the lightweight deps the test suite actually needs — the tests
      # deliberately avoid the embedding/LLM stack so CI stays fast.
      - run: pip install pytest requests
      - run: python -m pytest tests/ -v
